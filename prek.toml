# prek.toml – ottotom
#
# Git hook manager (pre-commit alternative).
# Install prek: https://github.com/j178/prek
#
# Install hooks:    prek install
# Run on all files: prek run --all-files
# Run on staged:    prek run

[default_language_version]
rust = "stable"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "detect-private-key" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo +nightly fmt --",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
  },
  {
    id = "cargo-check",
    name = "cargo check --all",
    entry = "cargo check --all",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
  },
]
