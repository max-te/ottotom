[package]
name = "ottotom-ephyra-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "Property-based tests for ottotom, written with ephyra"

[dependencies]
ottotom = { path = ".." }
ottotom-testsupport = { path = "../testsupport" }
opentelemetry = { version = "0.33.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = [
    "metrics",
    "experimental_metrics_custom_reader",
] }
ephyra = "0.0.1"

[dev-dependencies]
openmetrics-parser = "0.4.4"
tracing = "0.1.44"
