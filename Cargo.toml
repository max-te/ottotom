[package]
name = "ottotom"
version = "0.33.0"
edition = "2024"
# Bounded by the let-chain in `src/convert.rs`; 1.87 rejects it.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/max-te/ottotom"
keywords = ["opentelemetry", "observability", "prometheus", "metrics"]
categories = ["development-tools::debugging", "development-tools::profiling"]
readme = "README.md"
description = "Conversion of OpenTelemetry metrics to OpenMetrics Text format"

[workspace]
resolver = "3"
members = ["testsupport"]

[workspace.lints.rust]
# `deny`, not `forbid`: the benchmark installs a custom global allocator and
# opts out locally.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The `_ => unimplemented!()` arms in `write_values` are deliberate: they are
# what keeps a new `MetricData` variant in the SDK from being a compile error.
match_wildcard_for_single_variants = "allow"
# Metric values are compared against histogram bucket bounds, which the SDK
# stores as `f64`; the widening and the exact comparison are both intended.
cast_precision_loss = "allow"
float_cmp = "allow"
# `write_histogram` is one long straight-line writer; splitting it would spread
# the hot path over several functions for no gain.
too_many_lines = "allow"

[lints]
workspace = true

[workspace.dependencies]
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = [
    "metrics",
] }
ottotom-testsupport = { path = "testsupport", version = "=0.33.0" }

[dependencies]
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
memchr = "2.7.6"
itoa = "1.0.15"
ryu = { version = "1.0.20" }
tracing = { version = "0.1.41", optional = true }
ufmt = { version = "0.2.0", features = ["std"] }
arc-swap = { version = "1.9.2", optional = true }

[features]
exporter = ["dep:arc-swap"]
tracing = ["dep:tracing"]
experimental = []
default = ["tracing", "exporter"]

[dev-dependencies]
ottotom-testsupport.workspace = true
openmetrics-parser = "0.4.4"
tango-bench = "0.7"
insta = { version = "1.43.2" }
mutants = "0.0.4"
divan = { version = "5.0.1", package = "codspeed-divan-compat" }

[[bench]]
name = "converter"
harness = false

[[bench]]
name = "conversion"
harness = false
