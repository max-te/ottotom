name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check
      run: cargo check --all
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - features: ""
            skip-doctests: false
          - features: "--no-default-features"
            skip-doctests: true
          - features: "--features experimental"
            skip-doctests: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Run tests (${{ matrix.features || 'default' }})
      run: cargo test --verbose ${{ matrix.features }} ${{ matrix.skip-doctests && '--lib --bins --tests' || '' }}

  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fail CI when a statistically significant regression exceeds this %.
      BENCH_FAIL_THRESHOLD: 7
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Save PR head commit
      run: echo "PR_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - name: Resolve baseline ref
      id: baseline
      run: |
        ref="${{ github.event.pull_request.base.sha || github.event.before }}"
        if [ -n "$ref" ] && [ "$ref" != "0000000000000000000000000000000000000000" ]; then
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        else
          echo "No baseline ref available (e.g. initial push)"
        fi
    - name: Checkout baseline
      if: steps.baseline.outputs.ref != ''
      run: git checkout -f "${{ steps.baseline.outputs.ref }}"
    - name: Build and export baseline
      if: steps.baseline.outputs.ref != ''
      continue-on-error: true
      run: |
        cargo bench --bench converter --no-run
        mkdir -p target/benchmarks
        cp target/release/deps/converter-???????????????? target/benchmarks/converter
    - name: Restore PR code
      if: steps.baseline.outputs.ref != ''
      run: git checkout -f "$PR_HEAD"
    - name: Compare against baseline (or solo smoke-run if none exists)
      run: |
        set -o pipefail
        if [ -f target/benchmarks/converter ]; then
          cargo bench --bench converter -- --color never compare -v -t 3 -o \
            -f '!{small_to_string,*/16}' \
            --fail-threshold "$BENCH_FAIL_THRESHOLD" \
            target/benchmarks/converter 2>/dev/null | tee bench-results.txt
        else
          {
            echo "No baseline available; running solo benchmark as smoke test"
            cargo bench --bench converter -- --color never solo -v -t 3 -o
          } 2>/dev/null | tee bench-results.txt
        fi
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: bench-results
        path: bench-results.txt
        if-no-files-found: warn

  post-comment:
    runs-on: ubuntu-latest
    needs: bench
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Download benchmark results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: bench-results
        path: bench-results
    - name: Post benchmark results to PR
      uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
      with:
        script: |
          const fs = require('fs');
          const results = fs.readFileSync('bench-results/bench-results.txt', 'utf8');
          const marker = '<!-- ottotom-benchmark-results -->';
          const body = `${marker}\n## Benchmark results\n\n\`\`\`\n${results}\n\`\`\``;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
