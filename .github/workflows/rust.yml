name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Check
      run: cargo check --all
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - features: ""
            skip-doctests: false
          - features: "--no-default-features"
            skip-doctests: true
          - features: "--features experimental"
            skip-doctests: false
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Run tests (${{ matrix.features || 'default' }})
      run: cargo test --verbose ${{ matrix.features }} ${{ matrix.skip-doctests && '--lib --bins --tests' || '' }}

